<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>中国省级行政区拼图 · 八年级上册地理</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1020; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
    --txt:#e8eefb; --dim:#8ea0bd; --accent:#4fd1c5; --warn:#ff7a7a; --gold:#ffcb6b;
    --empty:rgba(255,255,255,.045); --stroke:rgba(255,255,255,.20);
  }
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 700px at 12% -10%, #16264a 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #12314a 0%, transparent 55%),
      var(--bg);
    color:var(--txt); font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }
  #app{height:100%;display:flex;flex-direction:column}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:12px 18px 10px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand h1{font-size:19px;letter-spacing:.5px;white-space:nowrap}
  .brand h1 span{color:var(--accent)}
  .brand .sub{font-size:12px;color:var(--dim);white-space:nowrap}
  .stats{display:flex;gap:8px;margin-left:auto}
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:5px 13px;text-align:center;min-width:74px;
  }
  .stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.4px}
  .stat span{font-size:10.5px;color:var(--dim)}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
  .seg button{
    background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;
    padding:5px 12px;border-radius:9px;cursor:pointer;transition:.18s;
  }
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:linear-gradient(180deg,#3fb9ae,#2f9e95);color:#04211f;font-weight:700}
  button.btn{
    background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:12.5px;
    padding:7px 14px;border-radius:11px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:6px
  }
  button.btn:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.22)}
  button.btn:active{transform:translateY(1px)}
  button.btn.pri{background:linear-gradient(180deg,#3fb9ae,#2f9e95);color:#04211f;font-weight:700;border-color:transparent}

  /* ---------- layout ---------- */
  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;padding:0 18px 16px}
  .board-wrap{
    position:relative;min-height:0;border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,rgba(13,25,48,.85),rgba(9,17,34,.9));
    border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.35) inset, 0 8px 30px rgba(0,0,0,.25);
  }
  #board{width:100%;height:100%;display:block;touch-action:none;user-select:none}
  .legend{
    position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;
    background:rgba(9,16,32,.62);border:1px solid var(--line);border-radius:12px;padding:9px 12px;
    backdrop-filter:blur(6px);font-size:11.5px;color:var(--dim);pointer-events:none
  }
  .legend .row{display:flex;align-items:center;gap:7px}
  .legend i{width:11px;height:11px;border-radius:3px;display:block}
  .legend .t{font-size:10.5px;letter-spacing:1px;color:#6f83a4;margin-bottom:1px}
  .tipbar{
    position:absolute;left:50%;top:12px;transform:translateX(-50%);
    background:rgba(9,16,32,.7);border:1px solid var(--line);border-radius:999px;
    padding:6px 16px;font-size:12px;color:var(--dim);backdrop-filter:blur(6px);
    max-width:92%;text-align:center;pointer-events:none;transition:opacity .3s
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:95;
    background:linear-gradient(180deg,rgba(31,52,84,.96),rgba(18,32,56,.96));
    border:1px solid rgba(120,200,230,.35);border-radius:14px;padding:10px 20px;
    font-size:14px;opacity:0;pointer-events:none;transition:.32s cubic-bezier(.2,.9,.3,1);
    box-shadow:0 12px 34px rgba(0,0,0,.45);white-space:nowrap
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast b{color:var(--accent);font-size:15px}
  .toast em{color:var(--gold);font-style:normal}

  /* ---------- tray ---------- */
  .tray{
    display:flex;flex-direction:column;min-height:0;border-radius:18px;
    background:linear-gradient(180deg,rgba(13,25,48,.72),rgba(9,17,34,.82));
    border:1px solid var(--line);overflow:hidden
  }
  .tray-head{
    display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);
    font-size:13px;color:var(--dim)
  }
  .tray-head b{color:var(--txt);font-size:13.5px}
  .bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3fb9ae,#7ee0c9);transition:width .35s}
  .tray-grid{
    flex:1;min-height:0;overflow-y:auto;padding:12px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-content:start
  }
  .tray-grid::-webkit-scrollbar{width:8px}
  .tray-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
  .cell{
    position:relative;aspect-ratio:1/1;border-radius:13px;cursor:grab;touch-action:none;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    display:flex;align-items:center;justify-content:center;padding:6px 4px 15px;
    transition:transform .16s, border-color .16s, background .16s, opacity .3s
  }
  .cell:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22);transform:translateY(-2px)}
  .cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,209,197,.25), 0 8px 22px rgba(0,0,0,.3)}
  .cell.done{pointer-events:none;background:rgba(79,209,197,.06);border-color:rgba(79,209,197,.22);transform:none}
  .cell.done .land{fill:rgba(255,255,255,.13);stroke:rgba(255,255,255,.2)}
  .cell.done .nm{color:#5d7d8c}
  .cell.done::after{content:"✓";position:absolute;right:6px;top:3px;font-size:12px;color:#4fd1c5;font-weight:700}
  .cell.shake{animation:shake .38s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  .cell svg{width:100%;height:100%;overflow:visible}
  .cell .nm{
    position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;color:#cfe0f5;
    letter-spacing:.5px;pointer-events:none
  }
  .cell .land{fill:var(--c,#9fb3d1);stroke:rgba(255,255,255,.55);stroke-width:1;vector-effect:non-scaling-stroke}
  body.challenge .cell:not(.done) .land{fill:#8ea3c1;stroke:rgba(255,255,255,.4)}
  body.challenge .cell .nm{display:none}

  /* ---------- board svg ---------- */
  #board .ocean{fill:transparent}
  #board .grid{stroke:rgba(120,170,230,.07);stroke-width:1}
  #board .prov .land{
    fill:var(--empty); stroke:var(--stroke); stroke-width:1; vector-effect:non-scaling-stroke;
    transition:fill .5s ease, stroke .35s ease;
  }
  #board .prov.on .land{fill:var(--c);stroke:rgba(255,255,255,.75);stroke-width:1.2}
  #board .prov.hover .land{stroke:#fff;stroke-width:2;stroke-dasharray:5 3}
  #board .prov.bad .land{fill:rgba(255,90,90,.30);stroke:#ff7a7a;stroke-width:2}
  body.nohint #board .prov .land{stroke:transparent}
  #board .prov.hintT .land{stroke:var(--gold);stroke-width:2.4}
  #board .lbl{
    font-size:14px;fill:#fff;paint-order:stroke;stroke:rgba(6,12,24,.85);stroke-width:3.2px;
    stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;pointer-events:none;
    opacity:0;transition:opacity .45s;font-weight:600
  }
  #board .lbl.on{opacity:1}
  body.easy #board .lbl{opacity:.72;stroke:rgba(6,12,24,.7)}
  body.easy #board .lbl.on{opacity:1}
  #board .lead{stroke:rgba(255,255,255,.45);stroke-width:1;opacity:0;transition:opacity .45s;vector-effect:non-scaling-stroke}
  #board .lead.on{opacity:.8}
  #board .dotc{fill:#fff;opacity:0;transition:opacity .45s}
  #board .dotc.on{opacity:.85}
  #board .ring{
    fill:none;stroke:var(--gold);stroke-width:2.5;vector-effect:non-scaling-stroke;
    transform-box:fill-box;transform-origin:center;animation:pulse 1.1s ease-out infinite
  }
  @keyframes pulse{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.25);opacity:0}}
  #board .insetbox{fill:rgba(255,255,255,.025);stroke:rgba(120,180,230,.45);stroke-width:1;vector-effect:non-scaling-stroke}
  #board .insetline{fill:none;stroke:rgba(150,215,255,.85);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linecap:round}
  #board .insettxt{fill:#8fb2d6;font-size:11.5px;text-anchor:middle;dominant-baseline:middle}

  /* ---------- drag ghost / cursor tip ---------- */
  #layer{position:fixed;inset:0;pointer-events:none;z-index:90}
  .ghost{position:absolute;left:0;top:0;width:104px;height:104px;will-change:transform}
  .ghost svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
  .ghost .land{fill:var(--c,#9fb3d1);stroke:#fff;stroke-width:1.6;vector-effect:non-scaling-stroke}
  .ghost .nm{display:none}
  body.challenge .ghost .land{fill:#8ea3c1}
  #tip{
    position:absolute;padding:3px 9px;border-radius:8px;background:rgba(8,14,28,.9);
    border:1px solid rgba(255,255,255,.16);font-size:12px;color:#dbe7fa;white-space:nowrap;
    transform:translate(14px,-50%);opacity:0;transition:opacity .12s
  }

  /* ---------- win overlay ---------- */
  #win{
    position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
    background:rgba(4,8,18,.72);backdrop-filter:blur(7px)
  }
  #win.show{display:flex}
  .card{
    position:relative;width:min(92vw,430px);border-radius:22px;padding:26px 28px 22px;text-align:center;
    background:linear-gradient(180deg,rgba(26,44,74,.98),rgba(13,23,42,.98));
    border:1px solid rgba(120,200,230,.3);box-shadow:0 30px 80px rgba(0,0,0,.6);
    animation:pop .4s cubic-bezier(.2,1.2,.4,1)
  }
  @keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
  .card h2{font-size:22px;margin-bottom:4px}
  .card .stars{font-size:30px;letter-spacing:6px;color:#3a4a66;margin:10px 0 4px}
  .card .stars i{font-style:normal}
  .card .stars i.on{color:var(--gold);text-shadow:0 0 16px rgba(255,203,107,.6)}
  .card .res{display:flex;justify-content:center;gap:10px;margin:14px 0 18px;flex-wrap:wrap}
  .card .res div{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:8px 16px;min-width:88px}
  .card .res b{display:block;font-size:18px}
  .card .res span{font-size:11px;color:var(--dim)}
  .card .btns{display:flex;gap:10px;justify-content:center}
  .card p.note{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.6}
  #confetti{position:absolute;inset:0;overflow:hidden;border-radius:22px;pointer-events:none}
  .cf{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(520px) rotate(720deg);opacity:.15}}

  /* ---------- 视图切换 / 连线练习 ---------- */
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
  .tabs button{background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;padding:6px 14px;border-radius:9px;cursor:pointer;transition:.18s;white-space:nowrap}
  .tabs button:hover{color:var(--txt)}
  .tabs button.on{background:linear-gradient(180deg,rgba(79,209,197,.24),rgba(79,209,197,.12));color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px rgba(79,209,197,.38)}
  #matchMain{display:none;grid-template-columns:1fr;padding:0 18px 16px;min-height:0}
  body.view-match #mapMain{display:none}
  body.view-match #matchMain{display:grid}
  .match-wrap{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(13,25,48,.72),rgba(9,17,34,.86));box-shadow:0 18px 50px rgba(0,0,0,.3) inset}
  .match-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim)}
  .match-bar b{color:var(--txt)}
  .match-bar b.acc{color:var(--accent)}
  .match-bar .mb-hint{flex:1;min-width:200px;line-height:1.5}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;transition:.16s}
  .chip i{width:8px;height:8px;border-radius:99px;display:block}
  .chip .cnt{font-size:10.5px;color:#7d93b5}
  .chip:hover{color:var(--txt);background:rgba(255,255,255,.1)}
  .chip.on{background:rgba(79,209,197,.14);border-color:rgba(79,209,197,.45);color:var(--accent);font-weight:700}
  .chip.on .cnt{color:var(--accent)}
  .match-area{position:relative;flex:1;min-height:0;padding:14px;display:grid;align-content:start;
    grid-template-columns:minmax(0,1fr) minmax(0,1.75fr) minmax(0,1.35fr);gap:0 38px}
  #matchLines{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
  #matchLines path{stroke-dasharray:100;stroke-dashoffset:0;animation:draw .42s ease-out}
  @keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  #matchLines path.pend{animation:none;stroke-dasharray:7 6}
  .mcol{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px}
  .mhead{font-size:12px;color:#7d93b5;letter-spacing:3px;text-align:center;padding-bottom:2px}
  .mitem{position:relative;display:flex;align-items:center;justify-content:center;height:54px;border-radius:13px;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.10);
    cursor:pointer;touch-action:none;font-size:15px;letter-spacing:.5px;transition:.16s;user-select:none;text-align:center;padding:0 6px}
  .col-short .mitem{font-size:19px;font-weight:600;color:#e2ecfb}
  .mitem:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.24)}
  .mitem.sel{border-color:var(--accent);background:rgba(79,209,197,.13);box-shadow:0 0 0 2px rgba(79,209,197,.26)}
  .mitem.hot{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,203,107,.3)}
  .mitem.linked{cursor:pointer}
  .mitem.locked{cursor:default}
  .mitem.bad{animation:shake .38s;border-color:var(--warn);background:rgba(255,122,122,.16)}
  .mitem.done-p{opacity:.66}
  .mitem.hintP{border-color:var(--gold);color:var(--gold);animation:glow .95s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 2px rgba(255,203,107,.22)}50%{box-shadow:0 0 0 7px rgba(255,203,107,.10)}}

  @media (max-width:1080px){
    main{grid-template-columns:minmax(0,1fr) 320px}
    .brand .sub{display:none}
  }
  @media (max-width:880px){
    #matchMain{padding:0 12px 12px}
    .match-area{gap:0 14px;padding:10px}
    .mitem{height:44px;font-size:13px}
    .col-short .mitem{font-size:16px}
    .match-bar{font-size:11.5px;gap:8px;padding:9px 12px}
  }
  @media (max-width:880px){
    body{overflow:auto}
    #app{height:auto;min-height:100%}
    main{grid-template-columns:1fr;grid-template-rows:minmax(46vh,1fr) auto;padding:0 12px 12px}
    .board-wrap{min-height:46vh}
    .tray{max-height:38vh}
    .tray-grid{grid-template-columns:repeat(5,1fr)}
    header{gap:10px;padding:10px 12px}
    .brand h1{font-size:16px}
    .stats{order:3;width:100%;margin-left:0}
    .stat{flex:1}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>中国省级行政区<span>拼图</span></h1>
      <div class="sub">八年级上册地理 · 34 个省级行政区域</div>
    </div>
    <div class="tabs" id="tabs">
      <button data-view="map" class="on">🗺️ 地图拼图</button>
      <button data-view="match">🔗 连线练习</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone">0/34</b><span id="sDoneLabel">已拼好</span></div>
      <div class="stat"><b id="sTime">00:00</b><span>用时</span></div>
      <div class="stat"><b id="sErr">0</b><span>错误</span></div>
      <div class="stat"><b id="sBest">--:--</b><span>最佳</span></div>
    </div>
    <div class="tools">
      <div class="seg" id="seg">
        <button data-mode="easy" class="on">简单</button>
        <button data-mode="normal">普通</button>
        <button data-mode="challenge">挑战</button>
      </div>
      <button class="btn" id="btnHint">💡 提示</button>
      <button class="btn" id="btnSound">🔊</button>
      <button class="btn pri" id="btnReset">↻ 重新开始</button>
    </div>
  </header>

  <main id="mapMain">
    <section class="board-wrap" id="boardWrap">
      <svg id="board" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="tipbar" id="tipbar">把右侧的省份碎片拖到地图上的正确位置</div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="tray">
      <div class="tray-head">
        <b>省份碎片</b>
        <div class="bar"><i id="barIn"></i></div>
        <span id="trayCnt">34</span>
      </div>
      <div class="tray-grid" id="trayGrid"></div>
    </aside>
  </main>

  <main id="matchMain">
    <section class="match-wrap">
      <div class="match-bar">
        <span class="mb-hint">把左边的 <b>简称</b>、右边的 <b>行政中心</b>，分别连到中间对应的 <b>全称</b> 上 —— 连对的线会按地理分区上色</span>
        <div class="chips" id="scopeChips"></div>
        <span>第 <b class="acc" id="mRound">1</b> 轮 · 本轮 <b id="mLeft">6</b> 个待完成</span>
      </div>
      <div class="match-area" id="matchArea">
        <svg id="matchLines" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="mcol col-short" data-col="0" id="col0"><div class="mhead">简称</div></div>
        <div class="mcol col-name" data-col="1" id="col1"><div class="mhead">全 称</div></div>
        <div class="mcol col-cap" data-col="2" id="col2"><div class="mhead">行政中心</div></div>
      </div>
    </section>
  </main>
</div>

<div id="layer"><div id="tip"></div></div>
<div class="toast" id="toast"></div>

<div id="win">
  <div class="card">
    <div id="confetti"></div>
    <h2 id="winTitle">拼图完成！</h2>
    <div class="stars" id="winStars"><i>★</i><i>★</i><i>★</i></div>
    <div class="res">
      <div><b id="winTime">00:00</b><span>用时</span></div>
      <div><b id="winErr">0</b><span>错误次数</span></div>
      <div><b id="winHint">0</b><span>提示次数</span></div>
    </div>
    <div class="btns">
      <button class="btn pri" id="btnAgain">再来一局</button>
      <button class="btn" id="btnClose">看看地图</button>
    </div>
    <p class="note" id="winNote">提示：换「挑战」模式再试一次 —— 遮住所有名称，只看轮廓，你能拼对吗？</p>
  </div>
</div>

<script>

function insideAnchor(ring, box) {
  const c = polyCentroid(ring);
  if (inPoly(ring, c[0], c[1])) return c;
  const [x0, y0, x1, y1] = box;
  let best = null, bestD = Infinity;
  for (let i = 1; i < 14; i++) for (let j = 1; j < 14; j++) {
    const x = x0 + (x1 - x0) * i / 14, y = y0 + (y1 - y0) * j / 14;
    if (!inPoly(ring, x, y)) continue;
    const dd = (x - c[0]) ** 2 + (y - c[1]) ** 2;
    if (dd < bestD) { bestD = dd; best = [x, y]; }
  }
  return best || c;
}
function polyCentroid(ring) {
  let a = 0, cx = 0, cy = 0, n = ring.length;
  for (let i = 0; i < n; i++) {
    const [x1, y1] = ring[i], [x2, y2] = ring[(i + 1) % n];
    const f = x1 * y2 - x2 * y1;
    a += f; cx += (x1 + x2) * f; cy += (y1 + y2) * f;
  }
  a *= 0.5;
  if (Math.abs(a) < 1e-9) return [ring[0][0], ring[0][1]];
  return [cx / (6 * a), cy / (6 * a)];
}
function inPoly(ring, x, y) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, dd = dx * dx + dy * dy;
  let t = dd > 1e-12 ? ((px - ax) * dx + (py - ay) * dy) / dd : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function ringDist(rings, x, y) {
  let m = Infinity;
  for (const r of rings) {
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const dd = segDist(x, y, r[j][0], r[j][1], r[i][0], r[i][1]);
      if (dd < m) m = dd;
    }
  }
  return m;
}
function hitProvince(x, y) {
  let near = null, nearD = Infinity;
  for (const p of PROV) {
    const [x0, y0, x1, y1] = p.box;
    if (x < x0 - 1 || x > x1 + 1 || y < y0 - 1 || y > y1 + 1) continue;
    for (const r of p.rings) if (inPoly(r, x, y)) return p;
    const dd = ringDist(p.rings, x, y);
    if (dd < nearD) { nearD = dd; near = p; }
  }
  return near && nearD < 3 ? near : null;
}

/* ================= LABEL LAYOUT (pure) ================= */
function layoutLabels(items, view) {
  const placed = [];
  const out = {};
  const overlap = (a, b) => !(a[0] + a[2] < b[0] || b[0] + b[2] < a[0] || a[1] + a[3] < b[1] || b[1] + b[3] < a[1]);
  for (const it of items) {
    const fs = it.area > 45000 ? 16 : (it.bw < 46 || it.bh < 46 ? 11 : 13.5);
    const w = it.short.length * fs * 0.78 + 4, h = fs * 1.12 + 3;
    const cands = [[0, 0]];
    const R = [.85, 1.3, 1.75, 2.3, 3, 3.8, 4.8];
    for (const r of R) for (let k = 0; k < 8; k++) {
      const a = (k * Math.PI) / 4 + (r > 2 ? Math.PI / 8 : 0);
      cands.push([Math.cos(a) * r * (w / 2 + fs), Math.sin(a) * r * (h / 2 + fs * .55)]);
    }
    let pick = null, fallback = null, fbScore = -Infinity;
    for (const [dx, dy] of cands) {
      const x = it.ax + dx, y = it.ay + dy;
      const rect = [x - w / 2, y - h / 2, w, h];
      if (rect[0] < 4 || rect[1] < 4 || rect[0] + w > view[2] - 4 || rect[1] + h > view[3] - 4) continue;
      let bad = 0;
      for (const q of placed) if (overlap(q, rect)) bad++;
      const score = -bad * 100 - Math.hypot(dx, dy) * 0.06;
      if (score > fbScore) { fbScore = score; fallback = { x, y, rect, d: Math.hypot(dx, dy) }; }
      if (!bad) { pick = { x, y, rect, d: Math.hypot(dx, dy) }; break; }
    }
    const c = pick || fallback || { x: it.ax, y: it.ay, rect: [it.ax, it.ay, w, h], d: 0 };
    placed.push([c.rect[0] - 2.5, c.rect[1] - 2.5, c.rect[2] + 5, c.rect[3] + 5]);   // 留出间距
    out[it.id] = { x: c.x, y: c.y, fs, lead: c.d > 7 };
  }
  return out;
}

}

  const near = pt && ringDist(d.p.rings, pt.x, pt.y) < tol;

  if (ringDist(S.sel.rings, pt.x, pt.y) < tol || hov === S.sel) {

}

function onItemDown(ev) {

  while (mSolid.firstChild) mSolid.removeChild(mSolid.firstChild);
  for (const l of M.links) {
    const p1 = anchorOf(l.a, "r"), p2 = anchorOf(l.b, "l");
    drawCurve(p1, p2, REGION_COLOR[BYID[l.pid].region], false);
  }
}
function redrawPend() {
  if (!syncLineSize()) return;
  while (mPend.firstChild) mPend.removeChild(mPend.firstChild);
  const src = M.pend && M.pend.moved ? M.pend.el : M.sel;
  if (!src || !M.pointer) return;
  const col = +src.dataset.col;
  const p1 = anchorOf(src, col === 2 ? "l" : "r");
  drawCurve(p1, M.pointer, "rgba(79,209,197,.9)", true);
}
function hintPair(pid) {
  const els = [...matchArea.querySelectorAll('.mitem[data-pid="' + pid + '"]')];
  for (const a of els) for (const b of els) if (pairOK(a, b)) return [a, b];
  return null;
}
function matchHint() {
  hideMatchHint();
  let pair = null;
  if (M.sel && freeDir(M.sel)) {
    const other = [...matchArea.querySelectorAll('.mitem[data-pid="' + M.sel.dataset.pid + '"]')].find((e) => pairOK(M.sel, e));
    if (other) pair = [M.sel, other];
  }
  if (!pair) {
    const cand = M.cur.filter((p) => linkCount(p.id) < 2);
    if (!cand.length) return;
    shuffle(cand);
    for (const p of cand) { pair = hintPair(p.id); if (pair) break; }
  }
  if (!pair) return;
  pair.forEach((e) => e.classList.add("hintP"));
  S.hints++; VERR.match.hints = S.hints;
  startClock();
  clearTimeout(M.hintT);
  M.hintT = setTimeout(hideMatchHint, 2400);
  beep([880, 1180], .12, "sine", .07);
}

/* ---------------- 计时 / 重置 / 模式 ---------------- */
function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
const V = { view: "map", acc: { map: 0, match: 0 } };          // 当前视图 + 各自累计用时
const VERR = { map: { errors: 0, hints: 0 }, match: { errors: 0, hints: 0 } };
function elapsed() { return V.acc[V.view] + (S.started ? Date.now() - S.t0 : 0); }
function tickClock() { $("#sTime").textContent = fmt(elapsed()); }
function startClock() {
  if (S.started) return;
  S.started = true; S.t0 = Date.now();
  clearInterval(S.timer);
  S.timer = setInterval(tickClock, 250);
  tickClock();
}
function pauseClock() {
  if (!S.started) return;
  V.acc[V.view] += Date.now() - S.t0;
  S.started = false;
  clearInterval(S.timer);
  tickClock();
}
function resetClock() {
  pauseClock();
  V.acc[V.view] = 0; S.started = false;
  clearInterval(S.timer);
  $("#sTime").textContent = "00:00";
}
function bestKey() { return V.view === "map" ? "cn-puzzle-best-" + S.mode : "cn-puzzle-best-match-" + M.scope; }
function readBest() {
  try { const v = localStorage.getItem(bestKey()); return v ? parseInt(v, 10) : 0; } catch (e) { return 0; }
}
function showBest() {
  const b = readBest();
  $("#sBest").textContent = b ? fmt(b) : "--:--";
}
function toast(html) {
  const t = $("#toast");
  t.innerHTML = html; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2300);
}
function reset() {
  resetClock();
  S.placed = 0; S.errors = 0; S.hints = 0; S.sel = null; S.drag = null;
  S.hover = null; VERR.map = { errors: 0, hints: 0 };
  $("#sTime").textContent = "00:00"; $("#sErr").textContent = "0";
  hideRings(); $("#win").classList.remove("show");
  $("#tipbar").style.opacity = 1;
  for (const p of PROV) {
    p.placed = false;
    p.g.classList.remove("on", "hover", "bad", "hintT");
    p.lbl.classList.remove("on"); p.lead.classList.remove("on"); p.dot.classList.remove("on");
  }
  buildTray(); update(); showBest();
  $("#toast").classList.remove("show");
  $("#confetti").innerHTML = "";
}
function setMode(m) {
  S.mode = m;
  document.body.classList.remove("easy", "normal", "challenge");
  document.body.classList.add(m);
  document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
  $("#tipbar").textContent = m === "easy"
    ? "简单模式：地图上标出了所有省份名称，拖拽右侧碎片到位"
    : m === "normal"
      ? "普通模式：地图不显示名称，把碎片拖到正确位置（悬浮可看名称）"
      : "挑战模式：只有轮廓，没有名称提示 —— 试试你记住了多少！";
  reset();
  try { localStorage.setItem("cn-puzzle-mode", m); } catch (e) {}
}
function win() {
  pauseClock();
  const ms = elapsed();
  const best = readBest();
  if (!best || ms < best) { try { localStorage.setItem(bestKey(), String(ms)); } catch (e) {} }
  const score = S.errors + S.hints * 0.5;
  const stars = score <= 5 && ms < 420000 ? 3 : score <= 14 ? 2 : 1;
  const isMatch = V.view === "match";
  $("#winTime").textContent = fmt(ms);
  $("#winErr").textContent = S.errors;
  $("#winHint").textContent = S.hints;
  document.querySelectorAll("#winStars i").forEach((el, i) => el.classList.toggle("on", i < stars));
  $("#winTitle").textContent = stars === 3
    ? (isMatch ? "全部连对！行政区划掌握得很牢 🎉" : "完美！你是地图小达人 🎉")
    : (isMatch ? "连线完成！🎉" : "拼图完成！🎉");
  $("#winNote").textContent = isMatch
    ? "提示：换个分区再练一遍（如「西北」「西南」），或切到「地图拼图」把省份摆回图上。"
    : "提示：换「挑战」模式再试一次 —— 遮住所有名称，只看轮廓，你能拼对吗？";
  $("#btnClose").textContent = isMatch ? "返回" : "看看地图";
  $("#win").classList.add("show");
  showBest();
  confetti();
  beep([523, 659, 784, 1047], .26, "sine", .1);
}
function confetti() {
  const box = $("#confetti");
  box.innerHTML = "";
  const cols = ["#e9a23b", "#7fb77e", "#4fa3d1", "#c97ba8", "#8a7fd1", "#d98a6a", "#55b8b0", "#fff"];
  for (let i = 0; i < 70; i++) {
    const d = document.createElement("i");
    d.className = "cf";
    d.style.left = Math.random() * 100 + "%";
    d.style.background = cols[i % cols.length];
    d.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
    d.style.animationDelay = (Math.random() * .7) + "s";
    d.style.opacity = .9;
    box.appendChild(d);
  }
}
$("#btnReset").addEventListener("click", () => { V.view === "match" ? matchReset() : reset(); });
$("#btnAgain").addEventListener("click", () => {
  $("#win").classList.remove("show");
  V.view === "match" ? matchReset() : reset();
});
$("#btnClose").addEventListener("click", () => $("#win").classList.remove("show"));
$("#btnSound").addEventListener("click", (e) => {
  S.sound = !S.sound;
  e.currentTarget.textContent = S.sound ? "🔊" : "🔇";
  if (S.sound) beep([880], .1, "sine", .08);
});
document.querySelectorAll("#seg button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
function setView(v, silent) {
  if (V.view === v && !silent) return;
  VERR[V.view].errors = S.errors; VERR[V.view].hints = S.hints;   // 保存当前视图的计数
  pauseClock();
  V.view = v;
  S.errors = VERR[v].errors; S.hints = VERR[v].hints;
  document.body.classList.toggle("view-match", v === "match");
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  $("#seg").style.display = v === "map" ? "" : "none";
  $("#sDoneLabel").textContent = v === "map" ? "已拼好" : "已连对";
  $("#sErr").textContent = S.errors;
  $("#sTime").textContent = fmt(V.acc[v]);
  hideMatchHint(); hideRings(); setHover(null);
  $("#win").classList.remove("show");
  if (v === "match") {
    if (!M.cur.length && !M.finished) matchReset();
    else { updateMatchStat(); requestAnimationFrame(() => { redrawLinks(); redrawPend(); }); }
  } else {
    update(); showBest();
  }
  try { localStorage.setItem("cn-puzzle-view", v); } catch (e) {}
}
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    setHover(null); S.sel = null; M.sel = null;
    document.querySelectorAll(".cell.sel").forEach((c) => c.classList.remove("sel"));
    clearSel(); hideMatchHint();
  }
  if (e.key === "r" || e.key === "R") { V.view === "match" ? matchReset() : reset(); }
  if (e.key === "h" || e.key === "H") $("#btnHint").click();
});
window.addEventListener("resize", () => {
  setHover(null);
  if (V.view === "match") { redrawLinks(); redrawPend(); }
});

/* ---------------- 启动 ---------------- */
(function init() {
  let m = "easy", v = "map";
  try {
    m = localStorage.getItem("cn-puzzle-mode") || "easy";
    v = localStorage.getItem("cn-puzzle-view") || "map";
  } catch (e) {}
  buildScopeChips();
  setMode(m);
  if (v === "match") setView("match");
  showBest();
})();
</script>
</body>
